[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apache-carbondata-agent"
version = "0.1.0"
description = "Agent-native context data format and local store for cross-agent collaboration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
hnsw = [
  "hnswlib>=0.8.0",
]
test = [
  "pytest>=7.4",
]
all = [
  "hnswlib>=0.8.0",
  "pytest>=7.4",
]

[tool.setuptools]
packages = [
  "Agent_module",
  "Agent_module.carbon_data",
  "Agent_module.carbon_data.chunkers",
  "Agent_module.carbon_data.embedders",
  "Agent_module.carbon_data.index",
]
package-dir = { Agent_module = "." }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
